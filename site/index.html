<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="暴喵 Codex 插件市场：为中文用户整理可安装的 Codex 插件。">
  <meta name="theme-color" content="#071426">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>暴喵 Codex 插件市场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23071426'/%3E%3Cpath d='M7 23V18h4v5zm7 0V13h4v10zm7 0V7h4v16z' fill='%23ffb000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/styles.css?v=20260814a">
  <script src="assets/app.js?v=20260814a" defer></script>
</head>
<body>
  <a class="skip-link" href="#catalog">跳到插件列表</a>
  <header class="masthead">
    <a class="brand" href="./" aria-label="暴喵 Codex 插件市场首页">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span><strong>暴喵</strong><small>CODEX PLUGINS</small></span>
    </a>
    <nav aria-label="主导航">
      <a href="#catalog">插件目录</a>
      <a href="contract.html">客户端契约</a>
    </nav>
  </header>

  <main>
    <section class="market-intro" aria-labelledby="market-title">
      <div>
        <p class="eyebrow">为中国大陆 Windows 用户准备</p>
        <h1 id="market-title">中文 Codex 插件市场</h1>
        <p class="lede">搜索需要的插件，查看来源与权限，然后通过暴喵客户端安装。</p>
      </div>
      <p class="plugin-total"><b id="approved-count">—</b><span>个可安装插件</span></p>
    </section>

    <section class="catalog-section" id="catalog" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">插件目录</p>
          <h2 id="catalog-title">搜索，筛选，直接安装</h2>
        </div>
        <p id="catalog-meta" role="status" aria-live="polite">正在读取目录…</p>
      </div>

      <form class="filters" id="filters" role="search">
        <label class="search-field" for="search">
          <span>搜索插件</span>
          <input id="search" name="q" type="search" autocomplete="off" placeholder="例如：PDF、Windows、流水线">
        </label>
        <label for="category">分类
          <select id="category" name="category"><option value="">全部分类</option></select>
        </label>
        <label for="publisher">发布者
          <select id="publisher" name="publisher">
            <option value="">全部发布者</option>
          </select>
        </label>
        <label for="origin">归属
          <select id="origin" name="origin">
            <option value="">全部归属</option>
            <option value="official">官方来源</option>
            <option value="community">社区来源</option>
          </select>
        </label>
        <label for="risk">权限
          <select id="risk" name="risk">
            <option value="">全部等级</option>
            <option value="low">低风险</option>
            <option value="medium">中风险</option>
            <option value="high">增强权限</option>
          </select>
        </label>
        <button type="reset">清除筛选</button>
      </form>

      <div class="catalog-grid" id="catalog-list" aria-busy="true"></div>
      <button class="load-more" id="load-more" type="button" hidden>继续显示</button>
      <div class="empty-state" id="empty-state" hidden>
        <strong>没有符合条件的插件</strong>
        <p>换一个关键词，或清除部分筛选条件。</p>
      </div>
      <div class="error-state" id="error-state" role="alert" hidden>
        <strong>目录暂时无法读取</strong>
        <p>请刷新页面；若仍失败，可检查仓库中的 <code>dist/catalog.json</code>。</p>
      </div>
    </section>

  </main>

  <footer>
    <p><strong>暴喵 Codex 插件市场</strong> · 72 个可安装插件</p>
    <p>“官方来源”仅说明上游身份，不代表暴喵对第三方功能作担保。</p>
  </footer>
</body>
</html>

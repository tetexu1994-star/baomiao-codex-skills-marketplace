name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_catalog --online
      - name: Build catalog using commit time
        env:
          CONFIGURED_PAGES_URL: ${{ vars.BAOMIAO_PAGES_URL }}
        run: |
          PUBLIC_BASE_URL="$CONFIGURED_PAGES_URL"
          if [ -z "$PUBLIC_BASE_URL" ]; then
            PUBLIC_BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          python -m scripts.build \
            --generated-at "$(git show -s --format=%cI HEAD)" \
            --marketplace-source "https://github.com/${{ github.repository }}" \
            --marketplace-ref "${{ github.sha }}" \
            --public-base-url "$PUBLIC_BASE_URL"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

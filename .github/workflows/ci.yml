name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate_catalog
      - name: Verify deterministic build
        shell: pwsh
        run: |
          python -m scripts.build --generated-at 2026-08-13T08:00:00Z
          $first = (Get-FileHash dist/catalog.json -Algorithm SHA256).Hash
          python -m scripts.build --generated-at 2026-08-13T08:00:00Z
          $second = (Get-FileHash dist/catalog.json -Algorithm SHA256).Hash
          if ($first -ne $second) { throw "Build output is not deterministic" }
